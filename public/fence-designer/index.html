<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden screens — fence &amp; trellis studio</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #e6e2d8; }
  #studio { position: absolute; inset: 0; display: flex; flex-direction: column;
    font-family: Archivo, system-ui, sans-serif; color: #23211c; }
  #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px; background: #faf8f2; border-bottom: 1px solid #cec8ba; }
  #bar .title { font: 600 12px/1 'Archivo Narrow', sans-serif; letter-spacing: .2em;
    text-transform: uppercase; white-space: nowrap; }
  #bar .group { display: flex; gap: 6px; }
  #bar .rule { width: 1px; align-self: stretch; background: #ddd7c9; }
  #bar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #bar .lbl { font: 500 11px/1 'Archivo Narrow', sans-serif; letter-spacing: .16em;
    text-transform: uppercase; color: #7a7365; white-space: nowrap; }
  #bar button { font: 500 12.5px Archivo, sans-serif; padding: 7px 16px; cursor: pointer;
    border: 1px solid #d5cfc2; background: #fff; color: #5b564c; }
  #bar button[aria-pressed="true"] { background: #8a6742; border-color: #8a6742; color: #fff; }
  #bar button.small { padding: 6px 11px; font-size: 12px; }
  #bar button.dirty { background: #b0552f; border-color: #b0552f; color: #fff; }
  #bar button.faint { opacity: .45; }
  #bar button[disabled] { opacity: .4; pointer-events: none; }
  #note { font-size: 11.5px; color: #7a7365; min-width: 168px; }
  #note.dirty { color: #b0552f; font-weight: 600; }
  #stage { flex: 1; width: 100%; border: 0; background: #e6e2d8; }
</style>
</head>
<body>
<div id="studio">
  <div id="bar">
    <div class="title">Garden screens</div>
    <div class="group" id="designs">
      <button data-design="fence">Fence</button>
      <button data-design="trellis">Trellis</button>
    </div>
    <div class="rule"></div>
    <div class="group" id="viewsSel">
      <button data-view="elevation">Elevation</button>
      <button data-view="render">3D render</button>
    </div>
    <div class="right">
      <span class="lbl" id="revLabel">Fence revision</span>
      <div class="group" id="revs"></div>
      <button id="update" class="small">Update A</button>
      <button id="restore" class="small">Restore A</button>
      <button id="del" class="small">Delete A</button>
      <span id="note"></span>
    </div>
  </div>
  <iframe id="stage" title="Garden screen view" allow="fullscreen"></iframe>
</div>

<script>
(function () {
  var LETTERS = ['A', 'B', 'C', 'D', 'E'];
  var VIEW_KEY = 'screen-studio-view';
  var REV_KEY = { fence: 'fence-revisions', trellis: 'trellis-revisions' };
  var PARAM_KEY = { fence: 'fence-params-v1', trellis: 'trellis-params-v1' };
  var DEFAULTS = {
    fence: { height: 1800, bay: 2400, bays: 2, latW: 38, latT: 16, postW: 75,
      gapBottom: 0.65, gapTop: 2.75, bigGaps: 3, gradient: 0, topMatch: true },
    trellis: { height: 1800, bay: 2400, bays: 2, latW: 38, latT: 18, postW: 75,
      gap: 2.75, offset: 0, wallHeight: 800 }
  };

  var state = { design: 'fence', view: 'elevation' };
  try {
    var v = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null');
    if (v && v.design && v.view) state = { design: v.design, view: v.view };
  } catch (e) {}

  function readRevs(d) {
    try { return JSON.parse(localStorage.getItem(REV_KEY[d]) || 'null') || { rev: 'A', revs: {} }; }
    catch (e) { return { rev: 'A', revs: {} }; }
  }
  function writeRevs(d, store) { try { localStorage.setItem(REV_KEY[d], JSON.stringify(store)); } catch (e) {} }
  function liveParams(d) {
    try { return JSON.parse(localStorage.getItem(PARAM_KEY[d]) || 'null'); } catch (e) { return null; }
  }
  function isDirty(d) {
    var store = readRevs(d);
    var base = store.revs[store.rev] ? store.revs[store.rev].settings : DEFAULTS[d];
    var live = liveParams(d);
    if (!live) return false;
    return Object.keys(DEFAULTS[d]).some(function (k) {
      var b = base[k] === undefined ? null : base[k];
      var l = live[k] === undefined ? b : live[k];
      return b !== l;
    });
  }
  function stamp(t) {
    return new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  var stage = document.getElementById('stage');
  var revsEl = document.getElementById('revs');
  var noteEl = document.getElementById('note');
  var lastKey = null;

  var blobUrl = null;
  function loadView(force) {
    var key = state.design + '-' + state.view;
    if (!force && key === lastKey) return;
    lastKey = key;
    // a blob URL keeps the same origin (so localStorage is shared) while still
    // giving the view a real document URL to resolve against
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    var b64 = document.getElementById('view-' + key).textContent.trim();
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var doc = new TextDecoder().decode(bytes);
    blobUrl = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
    stage.src = blobUrl;
  }

  function render() {
    var db = document.querySelectorAll('#designs button');
    for (var i = 0; i < db.length; i++)
      db[i].setAttribute('aria-pressed', db[i].getAttribute('data-design') === state.design);
    var vb = document.querySelectorAll('#viewsSel button');
    for (var j = 0; j < vb.length; j++)
      vb[j].setAttribute('aria-pressed', vb[j].getAttribute('data-view') === state.view);

    var store = readRevs(state.design);
    var dirty = isDirty(state.design);
    document.getElementById('revLabel').textContent =
      (state.design === 'fence' ? 'Fence' : 'Trellis') + ' revision';

    var sig = state.design + '|' + store.rev + '|' + dirty + '|' + LETTERS.map(function (L) {
      return store.revs[L] ? store.revs[L].at : 0; }).join(',');
    if (sig === render._sig) return;
    render._sig = sig;

    revsEl.innerHTML = '';
    LETTERS.forEach(function (L) {
      var b = document.createElement('button');
      b.className = 'small' + (store.revs[L] || L === store.rev ? '' : ' faint') +
        (L === store.rev && dirty ? ' dirty' : '');
      b.textContent = L;
      b.setAttribute('aria-pressed', L === store.rev);
      b.title = store.revs[L] ? 'Load revision ' + L + ' (saved ' + stamp(store.revs[L].at) + ')'
                              : 'Revision ' + L + ' — nothing saved yet';
      b.onclick = function () { loadRev(L); };
      revsEl.appendChild(b);
    });
    var upd = document.getElementById('update');
    upd.textContent = 'Update ' + store.rev;
    upd.className = 'small' + (dirty ? ' dirty' : '');
    var res = document.getElementById('restore');
    res.textContent = 'Restore ' + store.rev;
    res.disabled = !(store.revs[store.rev] && dirty);
    var del = document.getElementById('del');
    del.textContent = 'Delete ' + store.rev;
    del.disabled = !store.revs[store.rev];
    noteEl.className = dirty ? 'dirty' : '';
    noteEl.textContent = dirty
      ? (store.revs[store.rev] ? 'Unsaved changes since ' + stamp(store.revs[store.rev].at)
                               : 'Unsaved changes — rev ' + store.rev + ' is empty')
      : (store.revs[store.rev] ? 'Rev ' + store.rev + ' saved ' + stamp(store.revs[store.rev].at)
                               : 'Rev ' + store.rev + ' empty — showing defaults');
  }

  function go(next) {
    if (next.design) state.design = next.design;
    if (next.view) state.view = next.view;
    try { localStorage.setItem(VIEW_KEY, JSON.stringify(state)); } catch (e) {}
    loadView();
    render();
  }
  function loadRev(L) {
    var store = readRevs(state.design);
    if (store.revs[L]) {
      try { localStorage.setItem(PARAM_KEY[state.design], JSON.stringify(store.revs[L].settings)); } catch (e) {}
    }
    store.rev = L;
    writeRevs(state.design, store);
    loadView(true);
    render();
  }

  document.getElementById('update').onclick = function () {
    var store = readRevs(state.design);
    var live = liveParams(state.design);
    if (!live) return;
    store.revs[store.rev] = { at: Date.now(), settings: live };
    writeRevs(state.design, store);
    render();
  };
  document.getElementById('restore').onclick = function () { loadRev(readRevs(state.design).rev); };
  document.getElementById('del').onclick = function () {
    var store = readRevs(state.design);
    if (!store.revs[store.rev]) return;
    if (!window.confirm('Delete revision ' + store.rev + '? The ' + state.design + ' returns to its default settings.')) return;
    delete store.revs[store.rev];
    writeRevs(state.design, store);
    try { localStorage.setItem(PARAM_KEY[state.design], JSON.stringify(DEFAULTS[state.design])); } catch (e) {}
    loadView(true);
    render();
  };
  var dbs = document.querySelectorAll('#designs button');
  for (var a = 0; a < dbs.length; a++) (function (b) {
    b.onclick = function () { go({ design: b.getAttribute('data-design') }); };
  })(dbs[a]);
  var vbs = document.querySelectorAll('#viewsSel button');
  for (var c = 0; c < vbs.length; c++) (function (b) {
    b.onclick = function () { go({ view: b.getAttribute('data-view') }); };
  })(vbs[c]);

  // the drawings' own "3D render" / "Elevation" links are wired up from here,
  // once each view document is in place
  stage.addEventListener('load', function () {
    try {
      var doc = stage.contentDocument;
      if (!doc || doc.__studioWired) return;
      doc.__studioWired = true;
      doc.addEventListener('click', function (ev) {
        var a = ev.target && ev.target.closest && ev.target.closest('a[data-studio-view]');
        if (!a) return;
        ev.preventDefault();
        go({ view: a.getAttribute('data-studio-view') });
      }, true);
    } catch (e) {}
  });

  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (m && m.studio === 'view' && (m.view === 'render' || m.view === 'elevation')) go({ view: m.view });
  });

  setInterval(render, 700);   // picks up changes made inside the view
  loadView();
  render();
})();
</script>
</body>
</html>
